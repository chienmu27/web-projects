<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽球賽事報名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- 0. 試算表綁定管理列 -->
  <div id="adminBar" class="bg-slate-800 text-white shadow-inner">
    <div class="max-w-4xl mx-auto p-4 flex flex-col md:flex-row items-center gap-3">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">資料來源試算表：</span>
      <input type="text" id="spreadsheetUrlInput" placeholder="請貼上 Google 試算表網址或 ID..." class="flex-1 bg-slate-700 text-white text-sm px-3 py-1.5 rounded border border-slate-600 focus:outline-blue-400">
      
      <div class="flex gap-2 w-full md:w-auto">
        <button onclick="bindSpreadsheet()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-xs px-3 py-2 rounded font-medium transition">載入試算表</button>
        <button onclick="initSpreadsheet()" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-xs px-3 py-2 rounded font-medium transition">一鍵初始化</button>
        <button onclick="copyShareLink()" class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-2 rounded font-medium transition">🔗 複製專屬網址</button>
      </div>
    </div>
  </div>

  <!-- 頂部賽事資訊 -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto p-6">
      <h1 id="tourMainTitle" class="text-2xl md:text-3xl font-bold mb-3">請先綁定試算表...</h1>
      <div id="tourDynamicSettings" class="bg-blue-700/60 p-3.5 rounded-lg text-sm flex flex-wrap gap-x-6 gap-y-2 text-blue-50"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

    <!-- 1. 報名資料查詢區塊 -->
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700">🔍 報名資料查詢</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <select id="searchType" onchange="handleSearchTypeChange()" class="border rounded px-3 py-2 text-sm bg-slate-50 font-medium focus:outline-blue-500">
          <option value="phone">📱 報名人手機 (可修改/刪除)</option>
          <option value="name">👤 選手姓名 (僅供檢視)</option>
        </select>
        <input type="text" id="queryKeywordInput" placeholder="請輸入手機號碼查詢" class="flex-1 border rounded px-3 py-2 text-sm focus:outline-blue-500">
        <button onclick="executeQuery()" class="bg-slate-700 hover:bg-slate-800 text-white px-6 py-2 rounded text-sm transition">查詢</button>
      </div>

      <div id="queryResultArea" class="mt-4 hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border">
            <thead class="bg-slate-100 border-b">
              <tr>
                <th class="p-2">編號</th>
                <th class="p-2">組別</th>
                <th class="p-2">項目</th>
                <th class="p-2">選手名單</th>
                <th class="p-2 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="queryTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 2. 新增報名表單區塊 -->
    <div class="bg-white rounded-lg shadow p-5 space-y-5">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-700">📝 新增報名項目</h2>

      <!-- 動態報名人基本資料 -->
      <div id="dynamicFieldsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded border"></div>

      <!-- 組別與項目 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">選擇組別</label>
          <select id="categorySelect" onchange="onCategoryChange('add')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">選擇項目</label>
          <select id="eventSelect" onchange="handleEventChange('add')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
      </div>

      <!-- 選手輸入區 (可直接打字輸入 + 彈窗名單) -->
      <div class="space-y-3 bg-blue-50/50 p-4 rounded border border-blue-200">
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold w-20">選手一：<span class="text-red-500">*</span></span>
          <input type="text" id="player1Input" placeholder="請直接輸入姓名或點右側選擇" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('add', 1)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇名單</button>
        </div>
        <div id="player2Row" class="flex items-center gap-3 hidden">
          <span class="text-sm font-semibold w-20">選手二：<span class="text-red-500">*</span></span>
          <input type="text" id="player2Input" placeholder="請直接輸入姓名或點右側選擇" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('add', 2)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇名單</button>
        </div>
      </div>

      <div class="text-right">
        <button onclick="addToStagingList()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded text-sm font-medium transition">
          + 加入本次報名清單
        </button>
      </div>
    </div>

    <!-- 3. 本次暫存清單區塊 -->
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700">📋 本次報名清單 (待送出)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border">
          <thead class="bg-slate-100 border-b">
            <tr>
              <th class="p-2">組別</th>
              <th class="p-2">項目</th>
              <th class="p-2">選手名單</th>
              <th class="p-2 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="stagingTableBody">
            <tr><td colspan="4" class="text-center p-4 text-slate-400">目前尚無暫存資料，請由上方新增</td></tr>
          </tbody>
        </table>
      </div>

      <div class="mt-4 text-center">
        <button id="submitBtn" onclick="submitFinalRegistrations()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold shadow transition disabled:bg-gray-400" disabled>
          正式送出報名
        </button>
      </div>
    </div>

  </main>

  <!-- 修改報名彈跳視窗 -->
  <div id="editModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">修改報名資料（編號：<span id="editIdDisplay" class="text-blue-600"></span>）</h3>
        <button onclick="closeEditModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
      </div>

      <input type="hidden" id="editRegId">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">組別</label>
          <select id="editCategorySelect" onchange="onCategoryChange('edit')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">項目</label>
          <select id="editEventSelect" onchange="handleEventChange('edit')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
      </div>

      <div class="space-y-3 bg-slate-50 p-4 rounded border">
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold w-20">選手一：</span>
          <input type="text" id="editPlayer1Input" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('edit', 1)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇名單</button>
        </div>
        <div id="editPlayer2Row" class="flex items-center gap-3 hidden">
          <span class="text-sm font-semibold w-20">選手二：</span>
          <input type="text" id="editPlayer2Input" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('edit', 2)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇名單</button>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2 border-t">
        <button onclick="closeEditModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm">取消</button>
        <button onclick="submitEditRegistration()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-medium">確認修改送出</button>
      </div>
    </div>
  </div>

  <!-- 學生選擇彈跳視窗 -->
  <div id="studentModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[70] hidden">
    <div class="bg-white rounded-lg max-w-md w-full p-5 space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">選擇學生名單</h3>
        <button onclick="closeStudentModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
      </div>
      <input type="text" id="studentSearch" oninput="renderStudentList()" placeholder="搜尋學生姓名..." class="border rounded px-3 py-2 text-sm w-full focus:outline-blue-500">
      <div class="overflow-y-auto flex-1 divide-y border rounded max-h-64" id="studentListContainer"></div>
      <div class="text-right">
        <button onclick="closeStudentModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請確認此處與您 Google Apps Script 最新部署的網址一致（結尾必須為 /exec）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxbXfdX7Vor7W9Q-pxcB1J7XFFU6em2MlFGU2-ebgXcQXuZRO4WUxied2U5nTmo4g63/exec";

    let currentSid = "";
    let customFields = [];
    let studentDatabase = [];
    let allCategories = [];
    let allEvents = [];
    let stagingList = [];
    let currentModalTarget = { mode: 'add', slot: 1 };
    let queryRecordsCache = [];

    // 🌟 核心通訊引擎：採用 JSONP 徹底解決 CORS 與跨域權限問題
    function apiCall(params) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        const query = new URLSearchParams();
        for (const k in params) {
          query.set(k, params[k]);
        }
        query.set('callback', callbackName);

        const script = document.createElement('script');
        script.src = `${GAS_URL}?${query.toString()}`;

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = function() {
          cleanup();
          reject(new Error("無法連線至 Google Apps Script 伺服器！\n請以無痕視窗開啟 GAS 網址測試是否被教育帳號限制登入。"));
        };

        document.body.appendChild(script);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const sidFromParam = params.get("sid");

      if (sidFromParam) {
        document.getElementById("adminBar").classList.add("hidden");
        document.getElementById("spreadsheetUrlInput").value = sidFromParam;
        currentSid = sidFromParam;
        loadInitData();
      } else {
        document.getElementById("adminBar").classList.remove("hidden");
        document.getElementById("tourMainTitle").innerText = "請在上方輸入試算表網址並綁定";
      }
    });

    function bindSpreadsheet() {
      const val = document.getElementById("spreadsheetUrlInput").value.trim();
      if (!val) return alert("請輸入試算表網址或 ID！");
      currentSid = val;
      loadInitData();
    }

    function copyShareLink() {
      if (!currentSid) return alert("請先輸入並綁定試算表！");
      const match = currentSid.match(/\/d\/([a-zA-Z0-9-_]+)/);
      const cleanSid = match ? match[1] : currentSid;
      const shareUrl = `${window.location.origin}${window.location.pathname}?sid=${encodeURIComponent(cleanSid)}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("已複製專屬報名網址：\n" + shareUrl);
      });
    }

    async function initSpreadsheet() {
      const val = document.getElementById("spreadsheetUrlInput").value.trim();
      if (!val) return alert("請輸入試算表網址或 ID！");
      if (!confirm("確定要在此試算表上自動建立所需的工作表嗎？")) return;

      document.getElementById("tourMainTitle").innerText = "初始化工作表中...";

      try {
        const data = await apiCall({ action: "initSheets", sid: val });
        if (data.success) {
          alert("初始化成功！已建立相關工作表。");
          currentSid = val;
          loadInitData();
        } else {
          alert("初始化失敗：" + data.error);
        }
      } catch (err) {
        alert(err.message);
        document.getElementById("tourMainTitle").innerText = "初始化失敗";
      }
    }

    async function loadInitData() {
      document.getElementById("tourMainTitle").innerText = "讀取賽事資料中...";
      
      try {
        const data = await apiCall({ action: "getInitData", sid: currentSid });
        if (data.success) {
          const settings = data.settings || [];
          if (settings.length > 0) {
            document.getElementById("tourMainTitle").innerText = settings[0].value || settings[0].title;
            const detailsContainer = document.getElementById("tourDynamicSettings");
            detailsContainer.innerHTML = settings.slice(1).map(item => {
              if (!item.value) return '';
              const isUrl = item.value.startsWith("http://") || item.value.startsWith("https://");
              const valHtml = isUrl ? `<a href="${item.value}" target="_blank" class="underline text-yellow-200 hover:text-white">${item.title}</a>` : item.value;
              return `<div><strong>${item.title}：</strong>${valHtml}</div>`;
            }).join("");
          } else {
            document.getElementById("tourMainTitle").innerText = "羽球賽事報名系統";
          }

          customFields = data.fields || [];
          renderDynamicFields();

          studentDatabase = data.students || [];
          allCategories = data.categories || [];
          allEvents = data.events || [];

          renderCategoryOptions('add');
          renderCategoryOptions('edit');
        } else {
          alert("資料載入失敗：" + (data.error || "請先點擊一鍵初始化"));
          document.getElementById("tourMainTitle").innerText = "載入失敗，請先執行一鍵初始化！";
        }
      } catch (err) {
        alert(err.message);
        document.getElementById("tourMainTitle").innerText = "連線失敗";
      }
    }

    function renderDynamicFields() {
      const container = document.getElementById("dynamicFieldsContainer");
      container.innerHTML = customFields.map((f, i) => `
        <div>
          <label class="block text-sm font-semibold mb-1">${f.name} ${f.required ? '<span class="text-red-500">*</span>' : ''}</label>
          <input type="${f.name.includes('手機') || f.name.includes('電話') ? 'tel' : (f.name.includes('信箱') ? 'email' : 'text')}" 
                 id="customField_${i}" data-fieldname="${f.name}" data-required="${f.required}"
                 placeholder="請輸入${f.name}" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
        </div>
      `).join("");
    }

    function handleSearchTypeChange() {
      const type = document.getElementById("searchType").value;
      const input = document.getElementById("queryKeywordInput");
      input.placeholder = type === "phone" ? "請輸入報名人手機號碼 (可修改/刪除)" : "請輸入選手完整姓名 (僅供檢視)";
    }

    function renderCategoryOptions(mode) {
      const select = document.getElementById(mode === 'add' ? "categorySelect" : "editCategorySelect");
      if (allCategories.length === 0) {
        select.innerHTML = `<option value="">尚未設定組別</option>`;
        return;
      }
      select.innerHTML = allCategories.map(c => `<option value="${c.name}" data-id="${c.id}">${c.name}</option>`).join("");
      onCategoryChange(mode);
    }

    function onCategoryChange(mode) {
      const catSelect = document.getElementById(mode === 'add' ? "categorySelect" : "editCategorySelect");
      const selectedOption = catSelect.options[catSelect.selectedIndex];
      const eventSelect = document.getElementById(mode === 'add' ? "eventSelect" : "editEventSelect");

      if (!selectedOption || !selectedOption.getAttribute("data-id")) {
        eventSelect.innerHTML = `<option value="">無對應項目</option>`;
        return;
      }

      const categoryId = selectedOption.getAttribute("data-id");
      const filteredEvents = allEvents.filter(e => e.id === categoryId);

      eventSelect.innerHTML = filteredEvents.map(e => `<option value="${e.name}">${e.name}</option>`).join("");
      handleEventChange(mode);
    }

    function handleEventChange(mode) {
      const eventSelect = document.getElementById(mode === 'add' ? "eventSelect" : "editEventSelect");
      const isDouble = eventSelect.value.includes("雙");
      const p2Row = document.getElementById(mode === 'add' ? "player2Row" : "editPlayer2Row");

      if (isDouble) {
        p2Row.classList.remove("hidden");
      } else {
        p2Row.classList.add("hidden");
        document.getElementById(mode === 'add' ? "player2Input" : "editPlayer2Input").value = "";
      }
    }

    function openStudentModal(mode, slot) {
      currentModalTarget = { mode, slot };
      document.getElementById("studentSearch").value = "";
      renderStudentList();
      document.getElementById("studentModal").classList.remove("hidden");
    }

    function closeStudentModal() {
      document.getElementById("studentModal").classList.add("hidden");
    }

    function renderStudentList() {
      const keyword = document.getElementById("studentSearch").value.trim().toLowerCase();
      const container = document.getElementById("studentListContainer");
      container.innerHTML = "";

      const filtered = studentDatabase.filter(s => s.name.toLowerCase().includes(keyword));
      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-3 text-center text-gray-400 text-sm">查無名單（可直接手動輸入姓名）</div>`;
        return;
      }

      filtered.forEach(s => {
        const div = document.createElement("div");
        div.className = "p-3 hover:bg-blue-50 cursor-pointer flex justify-between items-center text-sm";
        div.innerHTML = `<span class="font-medium">${s.name}</span><span class="text-xs bg-gray-200 px-2 py-0.5 rounded text-gray-600">${s.note || ''}</span>`;
        div.onclick = () => {
          const prefix = currentModalTarget.mode === 'add' ? 'player' : 'editPlayer';
          document.getElementById(`${prefix}${currentModalTarget.slot}Input`).value = s.name;
          closeStudentModal();
        };
        container.appendChild(div);
      });
    }

    function addToStagingList() {
      const category = document.getElementById("categorySelect").value;
      const eventVal = document.getElementById("eventSelect").value;
      const isDouble = eventVal.includes("雙");
      const p1 = document.getElementById("player1Input").value.trim();
      const p2 = document.getElementById("player2Input").value.trim();

      if (!category || !eventVal) return alert("請先選擇組別與項目！");
      if (!p1) return alert("請填寫選手一姓名！");
      if (isDouble && !p2) return alert("雙打項目請填寫選手二姓名！");
      if (isDouble && p1 === p2) return alert("兩位選手不能為同一人！");

      stagingList.push({ category, event: eventVal, isDouble, player1: p1, player2: isDouble ? p2 : "" });
      document.getElementById("player1Input").value = "";
      document.getElementById("player2Input").value = "";
      renderStagingTable();
    }

    function renderStagingTable() {
      const tbody = document.getElementById("stagingTableBody");
      const submitBtn = document.getElementById("submitBtn");

      if (stagingList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-slate-400">目前尚無暫存資料，請由上方新增</td></tr>`;
        submitBtn.disabled = true;
        return;
      }

      submitBtn.disabled = false;
      tbody.innerHTML = stagingList.map((item, idx) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-2">${item.category}</td>
          <td class="p-2">${item.event}</td>
          <td class="p-2 font-medium">${item.isDouble ? `${item.player1} / ${item.player2}` : item.player1}</td>
          <td class="p-2 text-center">
            <button onclick="stagingList.splice(${idx}, 1); renderStagingTable();" class="text-red-500 hover:text-red-700 text-xs border border-red-200 px-2 py-1 rounded">刪除</button>
          </td>
        </tr>
      `).join("");
    }

    async function submitFinalRegistrations() {
      if (!currentSid) return alert("尚未綁定試算表！");
      if (stagingList.length === 0) return alert("暫存清單無項目！");

      const userData = {};
      let hasError = false;
      customFields.forEach((f, i) => {
        const input = document.getElementById(`customField_${i}`);
        const val = input ? input.value.trim() : "";
        if (f.required && !val) {
          alert(`請填寫必填欄位：${f.name}`);
          if (input) input.focus();
          hasError = true;
          return;
        }
        userData[f.name] = val;
      });
      if (hasError) return;

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "資料傳送中...";

      try {
        const data = await apiCall({
          action: "add",
          sid: currentSid,
          userData: JSON.stringify(userData),
          list: JSON.stringify(stagingList)
        });

        if (data.success) {
          alert("報名完成！已成功寫入試算表。");
          stagingList = [];
          renderStagingTable();
          if (userData["手機號碼"]) {
            document.getElementById("searchType").value = "phone";
            handleSearchTypeChange();
            document.getElementById("queryKeywordInput").value = userData["手機號碼"];
            executeQuery();
          }
        } else {
          alert("報名失敗：" + data.error);
        }
      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "正式送出報名";
      }
    }

    async function executeQuery() {
      if (!currentSid) return alert("尚未綁定試算表！");
      const type = document.getElementById("searchType").value;
      const keyword = document.getElementById("queryKeywordInput").value.trim();
      if (!keyword) return alert(type === 'phone' ? "請輸入手機號碼！" : "請輸入選手姓名！");

      const area = document.getElementById("queryResultArea");
      const tbody = document.getElementById("queryTableBody");
      tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-400">查詢中...</td></tr>`;
      area.classList.remove("hidden");

      try {
        const data = await apiCall({ action: "queryData", sid: currentSid, type: type, keyword: keyword });
        if (data.success && data.records.length > 0) {
          queryRecordsCache = data.records;
          const isPhoneQuery = (data.type === "phone");

          tbody.innerHTML = data.records.map((r, idx) => `
            <tr class="border-b hover:bg-slate-50">
              <td class="p-2 font-bold text-blue-600">${r.id}</td>
              <td class="p-2">${r.category}</td>
              <td class="p-2">${r.event}</td>
              <td class="p-2 font-medium">${r.isDouble ? `${r.player1} / ${r.player2}` : r.player1}</td>
              <td class="p-2 text-center">
                ${isPhoneQuery ? `
                  <button onclick="openEditModal(${idx})" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2.5 py-1 rounded shadow">✏️ 修改</button>
                  <button onclick="deleteRegistration('${r.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded shadow ml-1">🗑️ 刪除</button>
                ` : `
                  <span class="text-xs text-slate-400 italic">僅供檢視</span>
                `}
              </td>
            </tr>
          `).join("");
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-red-400">查無相關報名紀錄</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-red-400">查詢失敗：${err.message}</td></tr>`;
      }
    }

    function openEditModal(idx) {
      const record = queryRecordsCache[idx];
      document.getElementById("editRegId").value = record.id;
      document.getElementById("editIdDisplay").innerText = record.id;

      document.getElementById("editCategorySelect").value = record.category;
      onCategoryChange('edit');

      document.getElementById("editEventSelect").value = record.event;
      handleEventChange('edit');

      document.getElementById("editPlayer1Input").value = record.player1 || "";
      if (record.isDouble) {
        document.getElementById("editPlayer2Input").value = record.player2 || "";
      }

      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    async function submitEditRegistration() {
      const id = document.getElementById("editRegId").value;
      const category = document.getElementById("editCategorySelect").value;
      const eventVal = document.getElementById("editEventSelect").value;
      const isDouble = eventVal.includes("雙");
      const p1 = document.getElementById("editPlayer1Input").value.trim();
      const p2 = document.getElementById("editPlayer2Input").value.trim();

      if (!p1) return alert("選手一姓名不可為空！");
      if (isDouble && !p2) return alert("雙打項目選手二姓名不可為空！");

      const item = { id, category, event: eventVal, isDouble, player1: p1, player2: isDouble ? p2 : "" };

      try {
        const data = await apiCall({
          action: "update",
          sid: currentSid,
          item: JSON.stringify(item)
        });
        if (data.success) {
          alert(`編號 ${id} 修改成功！`);
          closeEditModal();
          executeQuery();
        } else {
          alert("修改失敗：" + data.error);
        }
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteRegistration(id) {
      if (!confirm(`確定要刪除報名編號【${id}】的項目嗎？`)) return;

      try {
        const data = await apiCall({
          action: "delete",
          sid: currentSid,
          id: id
        });
        if (data.success) {
          alert(`編號 ${id} 已成功刪除！`);
          executeQuery();
        } else {
          alert("刪除失敗：" + data.error);
        }
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
