<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽球賽報名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- 頂部賽事資訊 -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto p-6">
      <h1 id="tourName" class="text-2xl md:text-3xl font-bold mb-3">載入賽事資訊中...</h1>
      
      <!-- 動態依標題欄位呈現 -->
      <div class="bg-blue-700/60 p-3 rounded-lg text-sm space-y-1.5" id="tourDetails">
        <div id="dateRow">📅 載入日期資訊中...</div>
        <div id="placeAndLink" class="flex flex-wrap gap-x-6 gap-y-1 text-blue-100"></div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

    <!-- 1. 手機查詢區塊 -->
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700">🔍 報名資料查詢</h2>
      <div class="flex gap-2">
        <input type="tel" id="queryPhoneInput" placeholder="請輸入手機號碼查詢已報名資料" class="flex-1 border rounded px-3 py-2 text-sm focus:outline-blue-500">
        <button onclick="queryRegistration()" class="bg-slate-700 text-white px-5 py-2 rounded text-sm hover:bg-slate-800 transition">查詢</button>
      </div>
      <!-- 查詢結果 -->
      <div id="queryResultArea" class="mt-4 hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border">
            <thead class="bg-slate-100 border-b">
              <tr>
                <th class="p-2">編號</th>
                <th class="p-2">選手姓名</th>
                <th class="p-2">組別</th>
                <th class="p-2">項目</th>
                <th class="p-2">手機號碼</th>
              </tr>
            </thead>
            <tbody id="queryTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 2. 報名表單區塊 -->
    <div class="bg-white rounded-lg shadow p-5 space-y-4">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-700">📝 新增報名項目</h2>
      
      <!-- 填表人手機 -->
      <div>
        <label class="block text-sm font-semibold mb-1">報名人手機號碼 <span class="text-red-500">*</span></label>
        <input type="tel" id="mainPhone" placeholder="例如：0912345678" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
      </div>

      <!-- 組別與項目 (連動下拉選單) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">選擇組別</label>
          <select id="categorySelect" onchange="onCategoryChange()" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
            <option value="">載入組別中...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">選擇項目</label>
          <select id="eventSelect" onchange="handleEventChange()" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
            <option value="">請先選擇組別</option>
          </select>
        </div>
      </div>

      <!-- 選手選擇列 -->
      <div class="space-y-3 bg-slate-50 p-4 rounded border">
        <!-- 選手 1 -->
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold w-20">選手一：</span>
          <input type="text" id="player1Input" readonly placeholder="點擊按鈕選擇學生" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal(1)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇選手</button>
        </div>
        <!-- 選手 2 (雙打顯示) -->
        <div id="player2Row" class="flex items-center gap-3 hidden">
          <span class="text-sm font-semibold w-20">選手二：</span>
          <input type="text" id="player2Input" readonly placeholder="點擊按鈕選擇學生" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal(2)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇選手</button>
        </div>
      </div>

      <div class="text-right">
        <button onclick="addToStagingList()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded text-sm font-medium transition">
          + 加入報名清單
        </button>
      </div>
    </div>

    <!-- 3. 暫存清單區塊 -->
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700">📋 本次報名清單 (待送出)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border">
          <thead class="bg-slate-100 border-b">
            <tr>
              <th class="p-2">組別</th>
              <th class="p-2">項目</th>
              <th class="p-2">選手姓名</th>
              <th class="p-2 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="stagingTableBody">
            <tr><td colspan="4" class="text-center p-4 text-slate-400">目前尚無暫存資料，請由上方新增</td></tr>
          </tbody>
        </table>
      </div>

      <div class="mt-4 text-center">
        <button id="submitBtn" onclick="submitFinalRegistrations()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold shadow-md transition disabled:bg-gray-400" disabled>
          正式送出報名
        </button>
      </div>
    </div>

  </main>

  <!-- 學生選擇彈跳視窗 (Modal) -->
  <div id="studentModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg max-w-md w-full p-5 space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">選擇學生名單</h3>
        <button onclick="closeStudentModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
      </div>
      
      <input type="text" id="studentSearch" oninput="renderStudentList()" placeholder="搜尋學生姓名..." class="border rounded px-3 py-2 text-sm w-full focus:outline-blue-500">

      <div class="overflow-y-auto flex-1 divide-y border rounded" id="studentListContainer"></div>

      <div class="text-right">
        <button onclick="closeStudentModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm">取消</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入您的 Apps Script 網頁應用程式 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx_NkPKSFQ32DwLREXMfKTnXs3wLPprRlnCp6pEaFDxLq-o5Tr4lVOXTMMxECMxDvYd/exec";

    let studentDatabase = [];
    let allCategories = [];
    let allEvents = [];
    let currentTargetSlot = 1;
    let stagingList = [];

    window.addEventListener("DOMContentLoaded", () => {
      fetch(`${GAS_URL}?action=getInitData`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const s = data.settings || {};
            
            // 1. 比賽名稱 (對應「比賽名稱」標題)
            document.getElementById("tourName").innerText = s["比賽名稱"] || "羽球錦標賽";
            
            // 2. 日期區塊 (對應「報名日期」、「比賽日期」標題)
            const regDate = s["報名日期"] || "未定";
            const matchDate = s["比賽日期"] || "未定";
            document.getElementById("dateRow").innerHTML = `
              <span>📅 <strong>報名日期：</strong>${regDate}</span>
              <span class="mx-2">｜</span>
              <span>🏸 <strong>比賽日期：</strong>${matchDate}</span>
            `;

            // 3. 地點與規程連結 (對應「比賽地點」、「競賽章程」或「競賽規程」標題)
            const place = s["比賽地點"] ? `<span>📍 地點：${s["比賽地點"]}</span>` : "";
            const ruleLink = s["競賽章程"] || s["競賽規程"] || s["參考連結"] || "";
            const linkHtml = ruleLink ? `<span>🔗 連結：<a href="${ruleLink}" target="_blank" class="underline text-yellow-200 hover:text-white">競賽章程</a></span>` : "";
            
            document.getElementById("placeAndLink").innerHTML = place + (place && linkHtml ? "&nbsp;&nbsp;" : "") + linkHtml;

            // 4. 名單與組別
            studentDatabase = data.students || [];
            allCategories = data.categories || [];
            allEvents = data.events || [];

            renderCategoryOptions();
          }
        });
    });

    function renderCategoryOptions() {
      const catSelect = document.getElementById("categorySelect");
      catSelect.innerHTML = allCategories.map(c => `<option value="${c.name}" data-id="${c.id}">${c.name}</option>`).join("");
      onCategoryChange();
    }

    function onCategoryChange() {
      const catSelect = document.getElementById("categorySelect");
      const selectedOption = catSelect.options[catSelect.selectedIndex];
      if (!selectedOption) return;

      const categoryId = selectedOption.getAttribute("data-id");
      const filteredEvents = allEvents.filter(e => e.id === categoryId);

      const eventSelect = document.getElementById("eventSelect");
      eventSelect.innerHTML = filteredEvents.map(e => `<option value="${e.name}">${e.name}</option>`).join("");

      handleEventChange();
    }

    function handleEventChange() {
      const eventVal = document.getElementById("eventSelect").value;
      const isDouble = eventVal.includes("雙");
      const p2Row = document.getElementById("player2Row");
      if (isDouble) {
        p2Row.classList.remove("hidden");
      } else {
        p2Row.classList.add("hidden");
        document.getElementById("player2Input").value = "";
      }
    }

    function openStudentModal(slot) {
      currentTargetSlot = slot;
      document.getElementById("studentSearch").value = "";
      renderStudentList();
      document.getElementById("studentModal").classList.remove("hidden");
    }

    function closeStudentModal() {
      document.getElementById("studentModal").classList.add("hidden");
    }

    function renderStudentList() {
      const keyword = document.getElementById("studentSearch").value.trim().toLowerCase();
      const container = document.getElementById("studentListContainer");
      container.innerHTML = "";

      const filtered = studentDatabase.filter(s => s.name.toLowerCase().includes(keyword));
      
      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-3 text-center text-gray-400 text-sm">查無學生名單</div>`;
        return;
      }

      filtered.forEach(s => {
        const div = document.createElement("div");
        div.className = "p-3 hover:bg-blue-50 cursor-pointer flex justify-between items-center text-sm";
        div.innerHTML = `<span class="font-medium">${s.name}</span><span class="text-xs bg-gray-200 px-2 py-0.5 rounded text-gray-600">${s.gender || ''}</span>`;
        div.onclick = () => {
          if (currentTargetSlot === 1) document.getElementById("player1Input").value = s.name;
          else document.getElementById("player2Input").value = s.name;
          closeStudentModal();
        };
        container.appendChild(div);
      });
    }

    function addToStagingList() {
      const category = document.getElementById("categorySelect").value;
      const eventVal = document.getElementById("eventSelect").value;
      const isDouble = eventVal.includes("雙");
      const p1 = document.getElementById("player1Input").value;
      const p2 = document.getElementById("player2Input").value;

      if (!p1) return alert("請選擇選手一！");
      if (isDouble && !p2) return alert("雙打項目請選擇選手二！");
      if (isDouble && p1 === p2) return alert("兩位選手不能為同一人！");

      stagingList.push({
        category: category,
        event: eventVal,
        isDouble: isDouble,
        player1: p1,
        player2: isDouble ? p2 : ""
      });

      document.getElementById("player1Input").value = "";
      document.getElementById("player2Input").value = "";

      renderStagingTable();
    }

    function renderStagingTable() {
      const tbody = document.getElementById("stagingTableBody");
      const submitBtn = document.getElementById("submitBtn");

      if (stagingList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-slate-400">目前尚無暫存資料，請由上方新增</td></tr>`;
        submitBtn.disabled = true;
        return;
      }

      submitBtn.disabled = false;
      tbody.innerHTML = stagingList.map((item, idx) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-2">${item.category}</td>
          <td class="p-2">${item.event}</td>
          <td class="p-2 font-medium">${item.isDouble ? `${item.player1} / ${item.player2}` : item.player1}</td>
          <td class="p-2 text-center">
            <button onclick="stagingList.splice(${idx}, 1); renderStagingTable();" class="text-red-500 hover:text-red-700 text-xs border border-red-200 px-2 py-1 rounded">刪除</button>
          </td>
        </tr>
      `).join("");
    }

    function submitFinalRegistrations() {
      const phone = document.getElementById("mainPhone").value.trim();
      if (!phone) return alert("請填寫手機號碼！");
      if (stagingList.length === 0) return alert("暫存清單無項目！");

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "資料傳送中...";

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          phone: phone,
          list: stagingList
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("報名完成！已成功寫入試算表。");
          stagingList = [];
          renderStagingTable();
          document.getElementById("queryPhoneInput").value = phone;
          queryRegistration();
        } else {
          alert("報名失敗：" + data.error);
        }
      })
      .catch(err => alert("發生錯誤：" + err))
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "正式送出報名";
      });
    }

    function queryRegistration() {
      const phone = document.getElementById("queryPhoneInput").value.trim();
      if (!phone) return alert("請輸入手機號碼！");

      const area = document.getElementById("queryResultArea");
      const tbody = document.getElementById("queryTableBody");
      tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-400">查詢中...</td></tr>`;
      area.classList.remove("hidden");

      fetch(`${GAS_URL}?action=queryPhone&phone=${encodeURIComponent(phone)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.records.length > 0) {
            tbody.innerHTML = data.records.map(r => `
              <tr class="border-b">
                <td class="p-2 font-bold text-blue-600">${r.id}</td>
                <td class="p-2 font-medium">${r.name}</td>
                <td class="p-2">${r.category}</td>
                <td class="p-2">${r.event}</td>
                <td class="p-2 text-gray-500">${r.phone}</td>
              </tr>
            `).join("");
          } else {
            tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-red-400">查無此手機號碼的報名紀錄</td></tr>`;
          }
        });
    }
  </script>
</body>
</html>
