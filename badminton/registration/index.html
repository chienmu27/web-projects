<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽球賽報名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- 頂部賽事資訊 (完全依據「設定」工作表標題欄位動態顯示) -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto p-6">
      <h1 id="tourMainTitle" class="text-2xl md:text-3xl font-bold mb-3">載入賽事資訊中...</h1>
      <div id="tourDynamicSettings" class="bg-blue-700/60 p-3.5 rounded-lg text-sm flex flex-wrap gap-x-6 gap-y-2 text-blue-50"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

    <!-- 1. 手機查詢與修改/刪除區塊 -->
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700">🔍 報名資料查詢 / 修改</h2>
      <div class="flex gap-2">
        <input type="tel" id="queryPhoneInput" placeholder="請輸入手機號碼查詢" class="flex-1 border rounded px-3 py-2 text-sm focus:outline-blue-500">
        <button onclick="queryRegistration()" class="bg-slate-700 text-white px-5 py-2 rounded text-sm hover:bg-slate-800 transition">查詢</button>
      </div>
      
      <!-- 查詢結果清單 -->
      <div id="queryResultArea" class="mt-4 hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border">
            <thead class="bg-slate-100 border-b">
              <tr>
                <th class="p-2">編號</th>
                <th class="p-2">組別</th>
                <th class="p-2">項目</th>
                <th class="p-2">選手姓名</th>
                <th class="p-2 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="queryTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 2. 新增報名表單區塊 -->
    <div class="bg-white rounded-lg shadow p-5 space-y-4">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-700">📝 新增報名項目</h2>
      
      <div>
        <label class="block text-sm font-semibold mb-1">報名人手機號碼 <span class="text-red-500">*</span></label>
        <input type="tel" id="mainPhone" placeholder="例如：0912345678" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">選擇組別</label>
          <select id="categorySelect" onchange="onCategoryChange('add')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">選擇項目</label>
          <select id="eventSelect" onchange="handleEventChange('add')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
      </div>

      <div class="space-y-3 bg-slate-50 p-4 rounded border">
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold w-20">選手一：</span>
          <input type="text" id="player1Input" readonly placeholder="點擊按鈕選擇學生" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('add', 1)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇選手</button>
        </div>
        <div id="player2Row" class="flex items-center gap-3 hidden">
          <span class="text-sm font-semibold w-20">選手二：</span>
          <input type="text" id="player2Input" readonly placeholder="點擊按鈕選擇學生" class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('add', 2)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇選手</button>
        </div>
      </div>

      <div class="text-right">
        <button onclick="addToStagingList()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded text-sm font-medium transition">
          + 加入報名清單
        </button>
      </div>
    </div>

    <!-- 3. 暫存清單區塊 -->
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700">📋 本次報名清單 (待送出)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border">
          <thead class="bg-slate-100 border-b">
            <tr>
              <th class="p-2">組別</th>
              <th class="p-2">項目</th>
              <th class="p-2">選手姓名</th>
              <th class="p-2 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="stagingTableBody">
            <tr><td colspan="4" class="text-center p-4 text-slate-400">目前尚無暫存資料，請由上方新增</td></tr>
          </tbody>
        </table>
      </div>

      <div class="mt-4 text-center">
        <button id="submitBtn" onclick="submitFinalRegistrations()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold shadow-md transition disabled:bg-gray-400" disabled>
          正式送出報名
        </button>
      </div>
    </div>

  </main>

  <!-- 學生選擇彈跳視窗 (Modal) -->
  <div id="studentModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg max-w-md w-full p-5 space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">選擇學生名單</h3>
        <button onclick="closeStudentModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
      </div>
      <input type="text" id="studentSearch" oninput="renderStudentList()" placeholder="搜尋學生姓名..." class="border rounded px-3 py-2 text-sm w-full focus:outline-blue-500">
      <div class="overflow-y-auto flex-1 divide-y border rounded" id="studentListContainer"></div>
      <div class="text-right">
        <button onclick="closeStudentModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm">取消</button>
      </div>
    </div>
  </div>

  <!-- 修改報名彈跳視窗 (Edit Modal) -->
  <div id="editModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">修改報名資料（編號：<span id="editIdDisplay" class="text-blue-600"></span>）</h3>
        <button onclick="closeEditModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
      </div>

      <input type="hidden" id="editRegId">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">組別</label>
          <select id="editCategorySelect" onchange="onCategoryChange('edit')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">項目</label>
          <select id="editEventSelect" onchange="handleEventChange('edit')" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500"></select>
        </div>
      </div>

      <div class="space-y-3 bg-slate-50 p-4 rounded border">
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold w-20">選手一：</span>
          <input type="text" id="editPlayer1Input" readonly class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('edit', 1)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇選手</button>
        </div>
        <div id="editPlayer2Row" class="flex items-center gap-3 hidden">
          <span class="text-sm font-semibold w-20">選手二：</span>
          <input type="text" id="editPlayer2Input" readonly class="flex-1 bg-white border rounded px-3 py-2 text-sm">
          <button type="button" onclick="openStudentModal('edit', 2)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">選擇選手</button>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2 border-t">
        <button onclick="closeEditModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm">取消</button>
        <button onclick="submitEditRegistration()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-medium">確認修改送出</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入您的 Apps Script 網頁應用程式 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx_NkPKSFQ32DwLREXMfKTnXs3wLPprRlnCp6pEaFDxLq-o5Tr4lVOXTMMxECMxDvYd/exec";

    let studentDatabase = [];
    let allCategories = [];
    let allEvents = [];
    let stagingList = [];
    let currentModalTarget = { mode: 'add', slot: 1 };
    let queryRecordsCache = [];

    window.addEventListener("DOMContentLoaded", () => {
      fetch(`${GAS_URL}?action=getInitData`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            // 1. 動態渲染「設定」工作表標題欄位
            const settings = data.settings || [];
            if (settings.length > 0) {
              document.getElementById("tourMainTitle").innerText = settings[0].value || settings[0].title;
              const detailsContainer = document.getElementById("tourDynamicSettings");
              detailsContainer.innerHTML = settings.slice(1).map(item => {
                if (!item.value) return '';
                const isUrl = item.value.startsWith("http://") || item.value.startsWith("https://");
                const valHtml = isUrl ? `<a href="${item.value}" target="_blank" class="underline text-yellow-200 hover:text-white">${item.title}</a>` : item.value;
                return `<div><strong>${item.title}：</strong>${valHtml}</div>`;
              }).join("");
            }

            studentDatabase = data.students || [];
            allCategories = data.categories || [];
            allEvents = data.events || [];

            renderCategoryOptions('add');
            renderCategoryOptions('edit');
          }
        });
    });

    function renderCategoryOptions(mode) {
      const select = document.getElementById(mode === 'add' ? "categorySelect" : "editCategorySelect");
      select.innerHTML = allCategories.map(c => `<option value="${c.name}" data-id="${c.id}">${c.name}</option>`).join("");
      onCategoryChange(mode);
    }

    function onCategoryChange(mode) {
      const catSelect = document.getElementById(mode === 'add' ? "categorySelect" : "editCategorySelect");
      const selectedOption = catSelect.options[catSelect.selectedIndex];
      if (!selectedOption) return;

      const categoryId = selectedOption.getAttribute("data-id");
      const filteredEvents = allEvents.filter(e => e.id === categoryId);

      const eventSelect = document.getElementById(mode === 'add' ? "eventSelect" : "editEventSelect");
      eventSelect.innerHTML = filteredEvents.map(e => `<option value="${e.name}">${e.name}</option>`).join("");

      handleEventChange(mode);
    }

    function handleEventChange(mode) {
      const eventSelect = document.getElementById(mode === 'add' ? "eventSelect" : "editEventSelect");
      const isDouble = eventSelect.value.includes("雙");
      const p2Row = document.getElementById(mode === 'add' ? "player2Row" : "editPlayer2Row");

      if (isDouble) {
        p2Row.classList.remove("hidden");
      } else {
        p2Row.classList.add("hidden");
        document.getElementById(mode === 'add' ? "player2Input" : "editPlayer2Input").value = "";
      }
    }

    // 學生選取 Modal
    function openStudentModal(mode, slot) {
      currentModalTarget = { mode, slot };
      document.getElementById("studentSearch").value = "";
      renderStudentList();
      document.getElementById("studentModal").classList.remove("hidden");
    }

    function closeStudentModal() {
      document.getElementById("studentModal").classList.add("hidden");
    }

    function renderStudentList() {
      const keyword = document.getElementById("studentSearch").value.trim().toLowerCase();
      const container = document.getElementById("studentListContainer");
      container.innerHTML = "";

      const filtered = studentDatabase.filter(s => s.name.toLowerCase().includes(keyword));
      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-3 text-center text-gray-400 text-sm">查無學生名單</div>`;
        return;
      }

      filtered.forEach(s => {
        const div = document.createElement("div");
        div.className = "p-3 hover:bg-blue-50 cursor-pointer flex justify-between items-center text-sm";
        div.innerHTML = `<span class="font-medium">${s.name}</span><span class="text-xs bg-gray-200 px-2 py-0.5 rounded text-gray-600">${s.gender || ''}</span>`;
        div.onclick = () => {
          const prefix = currentModalTarget.mode === 'add' ? 'player' : 'editPlayer';
          document.getElementById(`${prefix}${currentModalTarget.slot}Input`).value = s.name;
          closeStudentModal();
        };
        container.appendChild(div);
      });
    }

    // 新增暫存清單
    function addToStagingList() {
      const category = document.getElementById("categorySelect").value;
      const eventVal = document.getElementById("eventSelect").value;
      const isDouble = eventVal.includes("雙");
      const p1 = document.getElementById("player1Input").value;
      const p2 = document.getElementById("player2Input").value;

      if (!p1) return alert("請選擇選手一！");
      if (isDouble && !p2) return alert("雙打項目請選擇選手二！");
      if (isDouble && p1 === p2) return alert("兩位選手不能為同一人！");

      stagingList.push({ category, event: eventVal, isDouble, player1: p1, player2: isDouble ? p2 : "" });
      document.getElementById("player1Input").value = "";
      document.getElementById("player2Input").value = "";
      renderStagingTable();
    }

    function renderStagingTable() {
      const tbody = document.getElementById("stagingTableBody");
      const submitBtn = document.getElementById("submitBtn");

      if (stagingList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-slate-400">目前尚無暫存資料，請由上方新增</td></tr>`;
        submitBtn.disabled = true;
        return;
      }

      submitBtn.disabled = false;
      tbody.innerHTML = stagingList.map((item, idx) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-2">${item.category}</td>
          <td class="p-2">${item.event}</td>
          <td class="p-2 font-medium">${item.isDouble ? `${item.player1} / ${item.player2}` : item.player1}</td>
          <td class="p-2 text-center">
            <button onclick="stagingList.splice(${idx}, 1); renderStagingTable();" class="text-red-500 hover:text-red-700 text-xs border border-red-200 px-2 py-1 rounded">刪除</button>
          </td>
        </tr>
      `).join("");
    }

    // 正式送出新增
    function submitFinalRegistrations() {
      const phone = document.getElementById("mainPhone").value.trim();
      if (!phone) return alert("請填寫手機號碼！");
      if (stagingList.length === 0) return alert("暫存清單無項目！");

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "資料傳送中...";

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ op: "add", phone, list: stagingList })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("報名完成！已成功寫入試算表。");
          stagingList = [];
          renderStagingTable();
          document.getElementById("queryPhoneInput").value = phone;
          queryRegistration();
        } else {
          alert("報名失敗：" + data.error);
        }
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "正式送出報名";
      });
    }

    // 查詢手機號碼
    function queryRegistration() {
      const phone = document.getElementById("queryPhoneInput").value.trim();
      if (!phone) return alert("請輸入手機號碼！");

      const area = document.getElementById("queryResultArea");
      const tbody = document.getElementById("queryTableBody");
      tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-400">查詢中...</td></tr>`;
      area.classList.remove("hidden");

      fetch(`${GAS_URL}?action=queryPhone&phone=${encodeURIComponent(phone)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.records.length > 0) {
            queryRecordsCache = data.records;
            tbody.innerHTML = data.records.map((r, idx) => `
              <tr class="border-b hover:bg-slate-50">
                <td class="p-2 font-bold text-blue-600">${r.id}</td>
                <td class="p-2">${r.category}</td>
                <td class="p-2">${r.event}</td>
                <td class="p-2 font-medium">${r.players.join(" / ")}</td>
                <td class="p-2 text-center space-x-2">
                  <button onclick="openEditModal(${idx})" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2.5 py-1 rounded shadow">✏️ 修改</button>
                  <button onclick="deleteRegistration('${r.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded shadow">🗑️ 刪除</button>
                </td>
              </tr>
            `).join("");
          } else {
            tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-red-400">查無此手機號碼的報名紀錄</td></tr>`;
          }
        });
    }

    // 開啟修改 Modal
    function openEditModal(idx) {
      const record = queryRecordsCache[idx];
      document.getElementById("editRegId").value = record.id;
      document.getElementById("editIdDisplay").innerText = record.id;

      // 設定組別
      document.getElementById("editCategorySelect").value = record.category;
      onCategoryChange('edit');

      // 設定項目
      document.getElementById("editEventSelect").value = record.event;
      handleEventChange('edit');

      // 設定選手
      document.getElementById("editPlayer1Input").value = record.players[0] || "";
      if (record.isDouble) {
        document.getElementById("editPlayer2Input").value = record.players[1] || "";
      }

      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    // 送出修改資料 (覆寫原資料，編號不變)
    function submitEditRegistration() {
      const id = document.getElementById("editRegId").value;
      const category = document.getElementById("editCategorySelect").value;
      const eventVal = document.getElementById("editEventSelect").value;
      const isDouble = eventVal.includes("雙");
      const p1 = document.getElementById("editPlayer1Input").value;
      const p2 = document.getElementById("editPlayer2Input").value;
      const phone = document.getElementById("queryPhoneInput").value.trim();

      if (!p1) return alert("請選擇選手一！");
      if (isDouble && !p2) return alert("雙打項目請選擇選手二！");
      if (isDouble && p1 === p2) return alert("兩位選手不能為同一人！");

      const item = { id, category, event: eventVal, isDouble, player1: p1, player2: isDouble ? p2 : "" };

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ op: "update", phone, item })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert(`編號 ${id} 修改成功！`);
          closeEditModal();
          queryRegistration();
        } else {
          alert("修改失敗：" + data.error);
        }
      });
    }

    // 刪除報名資料
    function deleteRegistration(id) {
      if (!confirm(`確定要刪除報名編號【${id}】的資料嗎？`)) return;

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ op: "delete", id })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert(`編號 ${id} 已成功刪除！`);
          queryRegistration();
        } else {
          alert("刪除失敗：" + data.error);
        }
      });
    }
  </script>
</body>
</html>
