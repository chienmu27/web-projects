<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鮮茶道寄杯 - 團購訂單系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-slate-800 min-h-screen">

  <!-- 系統管理頂列 (可自由切換 GAS 部署網址) -->
  <div class="bg-slate-900 text-white p-3 text-xs shadow-md">
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2 w-full md:w-auto flex-wrap">
        <span class="bg-amber-500 text-slate-950 font-bold px-2 py-0.5 rounded">GAS 部署網址</span>
        <input type="text" id="gasUrlInput" placeholder="請貼入 Apps Script 部署 URL..." class="text-slate-900 px-2 py-1 rounded w-80 text-xs bg-white focus:outline-none">
        <button onclick="saveGasUrl()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded font-medium transition">儲存網址</button>
      </div>
      <span id="loadStatusTag" class="text-amber-300 font-mono">載入中...</span>
    </div>
  </div>

  <!-- 活動看板橫幅 -->
  <header class="bg-gradient-to-r from-amber-600 to-amber-700 text-white shadow-lg">
    <div class="max-w-4xl mx-auto p-6">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
        <h1 id="shopTitle" class="text-2xl md:text-3xl font-extrabold">🥤 鮮茶道寄杯團購</h1>
        <span id="shopMerchant" class="bg-amber-800 text-amber-200 px-3 py-1 rounded-full text-xs font-semibold">鮮茶道</span>
      </div>
      <div id="shopSettingsBox" class="bg-black/25 p-4 rounded-xl text-sm space-y-1.5 border border-white/10 text-amber-100 leading-relaxed">
        載入活動資訊中...
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

    <!-- 1. 訂單查詢區塊 -->
    <div class="bg-white rounded-xl shadow-sm border border-amber-100 p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700 flex items-center gap-2">
        <span>🔍</span> 訂單查詢
      </h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <select id="searchType" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 font-medium focus:ring-2 focus:ring-amber-500">
          <option value="phone">📱 手機號碼 (可查詢、修改、刪除)</option>
          <option value="name">👤 訂購人姓名 (僅供檢視)</option>
        </select>
        <input type="text" id="queryKeyword" placeholder="請輸入手機號碼或姓名" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
        <button onclick="executeQuery()" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-lg text-sm font-semibold transition">查詢</button>
      </div>
      
      <div id="queryResultArea" class="mt-4 hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border-collapse border border-slate-200 rounded-lg">
            <thead class="bg-amber-50 text-slate-700 font-semibold border-b">
              <tr>
                <th class="p-2.5">編號</th>
                <th class="p-2.5">訂購人</th>
                <th class="p-2.5">品項</th>
                <th class="p-2.5">單價</th>
                <th class="p-2.5">數量</th>
                <th class="p-2.5">合計</th>
                <th class="p-2.5">總杯數</th>
                <th class="p-2.5">備註</th>
                <th class="p-2.5">狀態</th>
                <th class="p-2.5 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="queryTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 2. 新增訂購表單 -->
    <div class="bg-white rounded-xl shadow-sm border border-amber-100 p-5 space-y-4">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-700 flex items-center gap-2">
        <span>📝</span> 填寫訂購商品
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-amber-50/50 p-4 rounded-lg border border-amber-100">
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-semibold text-slate-700">訂購人姓名 <span class="text-red-500">*</span></label>
            <button type="button" onclick="openMemberModal()" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-2 py-0.5 rounded transition">從名單挑選</button>
          </div>
          <input type="text" id="buyerNameInput" placeholder="請輸入姓名" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">手機號碼 <span class="text-red-500">* (供修改查詢)</span></label>
          <input type="text" id="buyerPhoneInput" placeholder="如 0912345678" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-amber-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">選擇品項</label>
          <select id="productSelect" onchange="onProductChange()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500"></select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">單價</label>
          <input type="number" id="productPrice" readonly class="w-full border border-slate-200 bg-slate-100 rounded-lg px-3 py-2 text-sm font-bold text-slate-600">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">數量</label>
          <input type="number" id="productQty" min="1" value="1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700">備註 (統編或特殊需求)</label>
        <input type="text" id="productNote" placeholder="選填" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
      </div>

      <div class="text-right">
        <button onclick="addToStaging()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow transition">
          + 加入暫存訂單
        </button>
      </div>
    </div>

    <!-- 3. 暫存購物車 -->
    <div class="bg-white rounded-xl shadow-sm border border-amber-100 p-5">
      <h2 class="text-lg font-bold border-b pb-2 mb-3 text-slate-700 flex items-center justify-between">
        <span>📋 本次暫存清單 (待送出)</span>
        <span id="stagingSummary" class="text-sm font-bold text-amber-700"></span>
      </h2>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse border border-slate-200 rounded-lg">
          <thead class="bg-slate-100 text-slate-700 border-b">
            <tr>
              <th class="p-2.5">品項</th>
              <th class="p-2.5">單價</th>
              <th class="p-2.5">數量</th>
              <th class="p-2.5">小計</th>
              <th class="p-2.5">總杯數</th>
              <th class="p-2.5">備註</th>
              <th class="p-2.5 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="stagingTableBody" class="divide-y divide-slate-100">
            <tr><td colspan="7" class="text-center p-4 text-slate-400">目前尚無暫存商品</td></tr>
          </tbody>
        </table>
      </div>

      <div class="mt-5 text-center">
        <button id="submitBtn" onclick="submitFinalOrders()" class="bg-amber-600 hover:bg-amber-700 text-white px-10 py-3 rounded-xl font-extrabold shadow-md transition disabled:bg-gray-300 text-base" disabled>
          確認並送出訂單
        </button>
      </div>
    </div>

  </main>

  <!-- 修改訂單視窗 -->
  <div id="editModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 hidden backdrop-blur-sm">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">修改訂單內容（<span id="editIdDisplay" class="text-amber-600"></span>）</h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>
      <input type="hidden" id="editOrderId">
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700">訂購人姓名</label>
        <input type="text" id="editBuyerName" class="w-full border rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700">品項</label>
        <select id="editProductSelect" onchange="onEditProductChange()" class="w-full border rounded-lg px-3 py-2 text-sm"></select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">單價</label>
          <input type="number" id="editPrice" readonly class="w-full border bg-slate-100 rounded-lg px-3 py-2 text-sm font-bold text-slate-600">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">數量</label>
          <input type="number" id="editQty" min="1" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700">備註</label>
        <input type="text" id="editNote" class="w-full border rounded-lg px-3 py-2 text-sm">
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t">
        <button onclick="closeEditModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">取消</button>
        <button onclick="submitEditOrder()" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded-lg text-sm font-bold">儲存修改</button>
      </div>
    </div>
  </div>

  <!-- 名單彈窗 -->
  <div id="memberModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 hidden backdrop-blur-sm">
    <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">選擇常用訂購人</h3>
        <button onclick="closeMemberModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>
      <input type="text" id="memberSearch" oninput="renderMemberList()" placeholder="搜尋姓名或電話..." class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full">
      <div class="overflow-y-auto flex-1 divide-y border rounded-lg max-h-64" id="memberListContainer"></div>
      <div class="text-right">
        <button onclick="closeMemberModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">取消</button>
      </div>
    </div>
  </div>

  <script>
    // 預設設定
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbygegAhKyzW6tAROoT29e5LBndEycPZbgLw3Sn8dgXSUk4O9BWgNcHRQINZNUx7PqCiMw/exec";
    const SPREADSHEET_ID = "1Z09jyeIgkwHEDUCmYEbLG3PE6UGoPmeAadoCX2lmL3Q";

    let currentGasUrl = localStorage.getItem("tea_gas_url") || DEFAULT_GAS_URL;
    let membersDatabase = [];
    let productsDatabase = [];
    let stagingList = [];
    let queryRecordsCache = [];

    function saveGasUrl() {
      const val = document.getElementById("gasUrlInput").value.trim();
      if (!val) return alert("請輸入有效的 Apps Script URL！");
      localStorage.setItem("tea_gas_url", val);
      currentGasUrl = val;
      alert("✅ GAS 網址已儲存！");
    }

    // CSV 極速解析
    function parseCSV(text) {
      let p = '', c = '', r = [];
      let q = false;
      let row = [''];
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        let next = text[i+1];
        if (c === '"') {
          if (q && next === '"') { row[row.length - 1] += '"'; i++; }
          else { q = !q; }
        } else if (c === ',' && !q) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !q) {
          if (c === '\r' && next === '\n') { i++; }
          r.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') r.push(row);
      return r;
    }

    async function fetchSheetCSV(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`讀取「${sheetName}」失敗，請確認試算表已設為公開查看`);
      const text = await res.text();
      return parseCSV(text);
    }

    // 終極雙模式寫入引擎 (先 JSONP，超時自動降級 no-cors 確保必達)
    function callGAS(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gasCb_' + Math.round(100000 * Math.random());
        let isDone = false;

        const timer = setTimeout(() => {
          if (!isDone) {
            isDone = true;
            if (document.body.contains(script)) document.body.removeChild(script);
            
            // 如果 JSONP 逾時，發送 POST no-cors 備用通道
            fetch(currentGasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(Object.assign({ action: action, sid: SPREADSHEET_ID }, params))
            }).then(() => {
              resolve({ success: true, fallback: true });
            }).catch(e => reject(new Error("無法連線至 Google Apps Script，請檢查網址與部署權限！")));
          }
        }, 3500);

        window[callbackName] = function(data) {
          if (!isDone) {
            isDone = true;
            clearTimeout(timer);
            delete window[callbackName];
            if (document.body.contains(script)) document.body.removeChild(script);
            resolve(data);
          }
        };

        params.action = action;
        params.sid = SPREADSHEET_ID;
        params.callback = callbackName;
        const queryString = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
        
        const script = document.createElement('script');
        script.src = `${currentGasUrl}?${queryString}`;
        script.onerror = () => {
          if (!isDone) {
            isDone = true;
            clearTimeout(timer);
            delete window[callbackName];
            if (document.body.contains(script)) document.body.removeChild(script);
            
            fetch(currentGasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(params)
            }).then(() => {
              resolve({ success: true, fallback: true });
            }).catch(e => reject(new Error("後端連線失敗，請檢查 Apps Script 部署 URL 是否正確！")));
          }
        };
        document.body.appendChild(script);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("gasUrlInput").value = currentGasUrl;
      loadAllData();
    });

    async function loadAllData() {
      const statusTag = document.getElementById("loadStatusTag");
      statusTag.innerText = "⚡ 正在以 CSV 極速載入...";

      try {
        const startTime = performance.now();
        const [settingsData, productsData, membersData] = await Promise.all([
          fetchSheetCSV("設定"),
          fetchSheetCSV("產品清單"),
          fetchSheetCSV("訂購名單")
        ]);

        const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
        statusTag.innerText = `✅ 連線成功 (${elapsed}s)`;

        // 渲染設定
        if (settingsData && settingsData.length > 1) {
          const headers = settingsData[0];
          const values = settingsData[1];
          document.getElementById("shopTitle").innerText = values[0] || "鮮茶道寄杯團購";
          
          let html = "";
          for (let i = 1; i < headers.length; i++) {
            if (headers[i] && values[i]) {
              const val = values[i];
              const isUrl = val.startsWith("http://") || val.startsWith("https://");
              const content = isUrl ? `<a href="${val}" target="_blank" class="underline text-yellow-300 font-bold">${headers[i]} (點擊前往)</a>` : val;
              html += `<div><span class="font-bold text-amber-200">★ ${headers[i]}：</span>${content}</div>`;
            }
          }
          document.getElementById("shopSettingsBox").innerHTML = html;
        }

        // 渲染產品
        productsDatabase = [];
        for (let i = 1; i < productsData.length; i++) {
          if (productsData[i][0]) {
            productsDatabase.push({
              name: productsData[i][0],
              price: Number(productsData[i][1]) || 0,
              note: productsData[i][2] || ""
            });
          }
        }
        renderProductDropdown();

        // 常用名單
        membersDatabase = [];
        for (let i = 1; i < membersData.length; i++) {
          if (membersData[i][0]) {
            membersDatabase.push({
              name: membersData[i][0],
              phone: membersData[i][1] || ""
            });
          }
        }

      } catch (err) {
        statusTag.innerText = "❌ 讀取失敗";
        document.getElementById("shopSettingsBox").innerHTML = `
          <div class="text-red-300 font-bold">讀取失敗：${err.message}</div>
          <div class="text-xs text-amber-200 mt-2">請確認試算表右上角「共用」已開放「知道連結的任何人」查看。</div>
        `;
      }
    }

    function renderProductDropdown() {
      const select = document.getElementById("productSelect");
      const editSelect = document.getElementById("editProductSelect");
      const html = productsDatabase.map(p => 
        `<option value="${p.name}" data-price="${p.price}">${p.name} ($${p.price}) ${p.note ? ' - ' + p.note : ''}</option>`
      ).join("");

      select.innerHTML = html;
      editSelect.innerHTML = html;
      onProductChange();
    }

    function onProductChange() {
      const select = document.getElementById("productSelect");
      const opt = select.options[select.selectedIndex];
      if (opt) document.getElementById("productPrice").value = opt.getAttribute("data-price");
    }

    function onEditProductChange() {
      const select = document.getElementById("editProductSelect");
      const opt = select.options[select.selectedIndex];
      if (opt) document.getElementById("editPrice").value = opt.getAttribute("data-price");
    }

    function openMemberModal() {
      document.getElementById("memberSearch").value = "";
      renderMemberList();
      document.getElementById("memberModal").classList.remove("hidden");
    }

    function closeMemberModal() {
      document.getElementById("memberModal").classList.add("hidden");
    }

    function renderMemberList() {
      const keyword = document.getElementById("memberSearch").value.trim().toLowerCase();
      const container = document.getElementById("memberListContainer");
      container.innerHTML = "";

      const filtered = membersDatabase.filter(m => m.name.toLowerCase().includes(keyword) || m.phone.includes(keyword));
      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-gray-400 text-sm">查無名單</div>`;
        return;
      }

      filtered.forEach(m => {
        const div = document.createElement("div");
        div.className = "p-3 hover:bg-amber-50 cursor-pointer flex justify-between items-center text-sm";
        div.innerHTML = `<span class="font-bold text-slate-800">${m.name}</span><span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${m.phone}</span>`;
        div.onclick = () => {
          document.getElementById("buyerNameInput").value = m.name;
          if (m.phone) document.getElementById("buyerPhoneInput").value = m.phone;
          closeMemberModal();
        };
        container.appendChild(div);
      });
    }

    function addToStaging() {
      const name = document.getElementById("buyerNameInput").value.trim();
      const phone = document.getElementById("buyerPhoneInput").value.trim();
      const product = document.getElementById("productSelect").value;
      const price = Number(document.getElementById("productPrice").value) || 0;
      const qty = parseInt(document.getElementById("productQty").value, 10) || 1;
      const note = document.getElementById("productNote").value.trim();

      if (!name) return alert("請填寫訂購人姓名！");
      if (!phone) return alert("請填寫手機號碼！");
      if (qty <= 0) return alert("數量需大於 0！");

      stagingList.push({ product, price, qty, total: price * qty, totalCups: qty * 2, note });
      document.getElementById("productNote").value = "";
      document.getElementById("productQty").value = "1";
      renderStagingTable();
    }

    function renderStagingTable() {
      const tbody = document.getElementById("stagingTableBody");
      const submitBtn = document.getElementById("submitBtn");
      const summary = document.getElementById("stagingSummary");

      if (stagingList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-slate-400">目前尚無暫存商品</td></tr>`;
        submitBtn.disabled = true;
        summary.innerText = "";
        return;
      }

      submitBtn.disabled = false;
      let totalAmount = 0, totalCups = 0;

      tbody.innerHTML = stagingList.map((item, idx) => {
        totalAmount += item.total;
        totalCups += item.totalCups;
        return `
          <tr class="hover:bg-amber-50/50">
            <td class="p-2.5 font-bold">${item.product}</td>
            <td class="p-2.5">$${item.price}</td>
            <td class="p-2.5 font-bold">${item.qty}</td>
            <td class="p-2.5 text-amber-700 font-bold">$${item.total}</td>
            <td class="p-2.5 text-blue-600 font-bold">${item.totalCups} 杯</td>
            <td class="p-2.5 text-xs text-slate-500">${item.note || '-'}</td>
            <td class="p-2.5 text-center">
              <button onclick="stagingList.splice(${idx}, 1); renderStagingTable();" class="text-red-500 hover:text-red-700 text-xs px-2 py-1 rounded border border-red-200">刪除</button>
            </td>
          </tr>
        `;
      }).join("");

      summary.innerText = `合計：$${totalAmount} 元 ｜ 共 ${totalCups} 杯`;
    }

    function submitFinalOrders() {
      const name = document.getElementById("buyerNameInput").value.trim();
      const phone = document.getElementById("buyerPhoneInput").value.trim();
      if (!name || !phone) return alert("請填寫姓名與電話！");

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "寫入試算表中...";

      const payload = { op: "add", contact: { name, phone }, list: stagingList };

      callGAS("submitData", { payload: JSON.stringify(payload) })
        .then(res => {
          if (res.success) {
            alert("🎉 訂單已成功寫入試算表！");
            stagingList = [];
            renderStagingTable();
          } else {
            alert("❌ 送出失敗：" + (res.error || "未知錯誤"));
          }
        })
        .catch(err => alert("錯誤：" + err.message))
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "確認並送出訂單";
        });
    }

    async function executeQuery() {
      const type = document.getElementById("searchType").value;
      const keyword = document.getElementById("queryKeyword").value.trim();
      if (!keyword) return alert("請輸入查詢關鍵字！");

      const area = document.getElementById("queryResultArea");
      const tbody = document.getElementById("queryTableBody");
      tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-slate-400">正在極速查詢中...</td></tr>`;
      area.classList.remove("hidden");

      try {
        const rows = await fetchSheetCSV("訂購資料");
        queryRecordsCache = [];
        const cleanKeyword = keyword.replace(/^0+/, "");

        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          const rowId = r[0];
          const name = r[1];
          const product = r[2];
          const price = r[3];
          const qty = r[4];
          const total = r[5];
          const totalCups = r[6];
          const note = r[7];
          const payStatus = r[8] || "未繳費";
          const phone = String(r[9] || "").trim();
          const cleanPhone = phone.replace(/^0+/, "");

          let isMatch = false;
          if (type === "phone") {
            if (phone === keyword || (cleanKeyword !== "" && cleanPhone === cleanKeyword)) isMatch = true;
          } else if (type === "name") {
            if (name === keyword) isMatch = true;
          }

          if (isMatch) {
            queryRecordsCache.push({ id: rowId, name, product, price, qty, total, totalCups, note, payStatus, phone });
          }
        }

        if (queryRecordsCache.length > 0) {
          const isPhone = (type === "phone");
          tbody.innerHTML = queryRecordsCache.map((r, idx) => `
            <tr class="hover:bg-amber-50/50">
              <td class="p-2.5 font-mono text-xs font-bold text-amber-800">${r.id}</td>
              <td class="p-2.5 font-bold">${r.name}</td>
              <td class="p-2.5">${r.product}</td>
              <td class="p-2.5">$${r.price}</td>
              <td class="p-2.5 font-bold">${r.qty}</td>
              <td class="p-2.5 text-amber-700 font-bold">$${r.total}</td>
              <td class="p-2.5 text-blue-600 font-bold">${r.totalCups} 杯</td>
              <td class="p-2.5 text-xs text-slate-500">${r.note || '-'}</td>
              <td class="p-2.5"><span class="px-2 py-0.5 rounded text-xs ${r.payStatus === '已繳費' ? 'bg-emerald-100 text-emerald-700 font-bold' : 'bg-slate-100 text-slate-600'}">${r.payStatus}</span></td>
              <td class="p-2.5 text-center">
                ${isPhone ? `
                  <button onclick="openEditModal(${idx})" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2 py-1 rounded shadow">✏️ 修改</button>
                  <button onclick="deleteOrder('${r.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded shadow ml-1">🗑️ 刪除</button>
                ` : `<span class="text-xs text-slate-400">唯讀</span>`}
              </td>
            </tr>
          `).join("");
        } else {
          tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-red-400">查無相關訂購紀錄</td></tr>`;
        }

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-red-500">查詢失敗：${err.message}</td></tr>`;
      }
    }

    function openEditModal(idx) {
      const record = queryRecordsCache[idx];
      document.getElementById("editOrderId").value = record.id;
      document.getElementById("editIdDisplay").innerText = record.id;
      document.getElementById("editBuyerName").value = record.name;
      document.getElementById("editProductSelect").value = record.product;
      onEditProductChange();
      document.getElementById("editQty").value = record.qty;
      document.getElementById("editNote").value = record.note || "";
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    function submitEditOrder() {
      const id = document.getElementById("editOrderId").value;
      const name = document.getElementById("editBuyerName").value.trim();
      const product = document.getElementById("editProductSelect").value;
      const price = Number(document.getElementById("editPrice").value) || 0;
      const qty = parseInt(document.getElementById("editQty").value, 10) || 1;
      const note = document.getElementById("editNote").value.trim();

      const item = { id, name, product, price, qty, note };
      callGAS("submitData", { payload: JSON.stringify({ op: "update", item }) })
        .then(res => {
          if (res.success) {
            alert(`訂單 ${id} 修改成功！`);
            closeEditModal();
            executeQuery();
          } else {
            alert("修改失敗：" + (res.error || ""));
          }
        })
        .catch(err => alert("修改錯誤：" + err.message));
    }

    function deleteOrder(id) {
      if (!confirm(`確定要刪除訂單【${id}】嗎？`)) return;
      callGAS("submitData", { payload: JSON.stringify({ op: "delete", id }) })
        .then(res => {
          if (res.success) {
            alert(`訂單 ${id} 已刪除！`);
            executeQuery();
          } else {
            alert("刪除失敗：" + (res.error || ""));
          }
        })
        .catch(err => alert("刪除錯誤：" + err.message));
    }
  </script>
</body>
</html>
